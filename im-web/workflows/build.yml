name: Build and Release Electron App

on:
  push:
    branches:
      - main        # 只要向 main 分支推送代码就触发
    tags:
      - 'v*.*.*'    # 推送 v 开头的标签也触发
  workflow_dispatch: # 允许在 GitHub Actions 页面手动点击按钮触发

jobs:
  build:
    # 使用矩阵策略，同时在 macOS、Windows 和 Linux 环境下打包
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      # 1. 检出你的项目代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 设置 Node.js 环境（建议使用 LTS 版本，如 18 或 20）
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      # 3. 安装项目依赖
      - name: Install dependencies
        run: npm ci

      # 4. 执行打包命令
      # 设置 GH_TOKEN 环境变量，让 electron-builder 能自动上传到 GitHub Releases
      - name: Build Electron App
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # 5. 将打包好的文件作为构建产物上传（方便直接下载）
      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.os }}-builds
          path: dist_electron/**