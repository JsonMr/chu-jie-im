name: Build and Release Electron App

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-14
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: ./im-web/package-lock.json

      - name: Install dependencies (skip postinstall)
        run: |
          cd ./im-web
          # 临时备份并修改 package.json，避免 postinstall 执行
          cp package.json package.json.backup
          # 移除 postinstall 和 postuninstall 脚本
          if command -v jq &> /dev/null; then
            jq 'del(.scripts.postinstall, .scripts.postuninstall)' package.json > package.json.tmp
            mv package.json.tmp package.json
          else
            sed -i.bak '/"postinstall"/d' package.json
            sed -i.bak '/"postuninstall"/d' package.json
          fi
          # 安装依赖
          npm install --legacy-peer-deps --no-optional
          # 安装缺失的 dmg-license（macOS DMG 打包必需）
          npm install dmg-license --save-dev --no-optional
          # 恢复原始 package.json
          mv package.json.backup package.json
        shell: bash

      - name: Build Electron App for macOS
        run: |
          cd ./im-web
          npm run electron:build-mac
        env:
          # ARM64 架构（Apple Silicon）
          npm_config_arch: arm64
          npm_config_target_arch: arm64
          npm_config_build_from_source: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Build-ARM64
          path: ./im-web/dist_electron/*.dmg
          if-no-files-found: warn

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ./im-web/dist_electron/*.dmg
            ./im-web/dist_electron/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
